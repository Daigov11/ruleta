<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta de Preguntas</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>🎡 Ruleta de Preguntas</h1>

  <div class="app">

    <div class="panel">
      <h2>Preguntas</h2>
      <form id="addForm">
        <input type="text" id="questionInput" placeholder="Escribe una pregunta (ej: x + 3 = 16)" autocomplete="off">
        <button type="submit">Agregar</button>
      </form>

      <div class="options-toggle">
        <label><input type="checkbox" id="enableOptions"> Agregar alternativas (A, B, C, D)</label>
      </div>
      <div id="optionsEditor" class="options-editor hidden">
        <div class="option-row">
          <input type="radio" name="correctOption" value="0" id="correctA" checked>
          <label for="correctA">A)</label>
          <input type="text" class="option-input" data-idx="0" placeholder="Alternativa A">
        </div>
        <div class="option-row">
          <input type="radio" name="correctOption" value="1" id="correctB">
          <label for="correctB">B)</label>
          <input type="text" class="option-input" data-idx="1" placeholder="Alternativa B">
        </div>
        <div class="option-row">
          <input type="radio" name="correctOption" value="2" id="correctC">
          <label for="correctC">C)</label>
          <input type="text" class="option-input" data-idx="2" placeholder="Alternativa C">
        </div>
        <div class="option-row">
          <input type="radio" name="correctOption" value="3" id="correctD">
          <label for="correctD">D)</label>
          <input type="text" class="option-input" data-idx="3" placeholder="Alternativa D">
        </div>
        <p class="hint-small">Marca el círculo de la alternativa correcta. Se aplica a la próxima pregunta (texto o imagen) que agregues.</p>
      </div>

      <div class="or-divider">o</div>

      <button type="button" id="addImageBtn" class="secondary-btn">📷 Agregar imagen del problema</button>
      <input type="file" id="imageFileInput" accept="image/*" hidden>

      <ul id="questionList"></ul>
      <p class="hint" id="emptyHint">Agrega al menos 2 preguntas para poder girar.</p>

      <div class="sessions">
        <h2>Sesiones guardadas</h2>
        <select id="sessionSelect">
          <option value="">— Selecciona una sesión —</option>
        </select>
        <div class="session-actions">
          <button type="button" id="saveSessionBtn">Guardar</button>
          <button type="button" id="loadSessionBtn">Cargar</button>
          <button type="button" id="deleteSessionBtn" class="danger">Eliminar</button>
        </div>
      </div>
    </div>

    <div class="wheel-area">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="440" height="440"></canvas>
      </div>
      <button id="spinBtn" disabled>Girar</button>
      <button id="resetUsedBtn" class="reset-btn" hidden>🔄 Reiniciar preguntas</button>
    </div>

  </div>

  <!-- Result overlay, styled like the reference card -->
  <div id="overlay" class="overlay hidden">
    <div class="result-card" id="resultCard">
      <div id="resultContent"></div>
      <div class="result-arrow"></div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
